# Dedicated Linux development VM. Plain mode disables host filesystem sharing.
plain: true
vmType: vz
cpus: 4
memory: 4GiB
disk: 20GiB
images:
  - location: https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img
    arch: aarch64
  - location: https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img
    arch: x86_64
provision:
  - mode: system
    script: |
      #!/bin/sh
      set -eu
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y busybox-static binutils ca-certificates curl make iproute2 nftables util-linux conntrack apparmor-utils
      # Scope unprivileged user namespace permission to the runtime executable.
      cat > /etc/apparmor.d/mini-docker <<'APPARMOR'
      abi <abi/4.0>,
      profile mini-docker-rootless /usr/local/bin/mdocker flags=(unconfined,attach_disconnected) {
        userns,
      }
      APPARMOR
      apparmor_parser -r /etc/apparmor.d/mini-docker
      case $(uname -m) in
        aarch64)
          arch=arm64
          checksum=3450b45a3f9ee8568792736a5c5e70a1f2e9b36c35a8f74958c03e51d7d92bec
          ;;
        x86_64)
          arch=amd64
          checksum=63d339f0da5ab53635a56f2490a7984dfe12dfcff22ad749f63edaf590168445
          ;;
        *) echo 'Unsupported Linux architecture' >&2; exit 1 ;;
      esac
      archive=$(mktemp)
      trap 'rm -f "$archive"' EXIT HUP INT TERM
      curl -fSL --connect-timeout 15 --max-time 300 --retry 2 --retry-max-time 600 "https://go.dev/dl/go1.27.1.linux-$arch.tar.gz" -o "$archive"
      printf '%s  %s\n' "$checksum" "$archive" | sha256sum -c -
      [ ! -e /usr/local/go ] || { echo '/usr/local/go already exists' >&2; exit 1; }
      tar -C /usr/local -xzf "$archive"
      ln -s /usr/local/go/bin/go /usr/local/bin/go
      ln -s /usr/local/go/bin/gofmt /usr/local/bin/gofmt
