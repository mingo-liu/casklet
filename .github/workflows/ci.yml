name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: make fmt-check test vet test-race
      - name: Build macOS clients with bundled Linux engines
        if: runner.os == 'macOS'
        run: |
          make build GOARCH=arm64
          make build GOARCH=amd64
      - name: Build native Linux engine
        if: runner.os == 'Linux'
        run: make engine

  vulnerabilities:
    name: Vulnerabilities (all client/engine targets)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: make vuln

  linux-integration:
    name: Linux integration (${{ matrix.os }})
    needs: [checks, vulnerabilities]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    # GitHub-hosted runners are disposable VMs. Do not change this to a shared
    # self-hosted runner: provisioning modifies forwarding and user delegation.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Prepare disposable integration VM
        env:
          MINI_DOCKER_DEDICATED_VM: "1"
        run: ./scripts/prepare-integration-vm.sh
      - name: Prepare template and run privileged Linux suite
        run: make rootfs test-integration
