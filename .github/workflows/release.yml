name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag and unpublished draft release to validate and publish
        required: true
        type: string
      macos_tested_revision:
        description: Full commit SHA that passed the manual Apple silicon VM suite without skips
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate draft and trusted revision
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.candidate.outputs.revision }}
      tag_oid: ${{ steps.candidate.outputs.tag_oid }}
      release_id: ${{ steps.candidate.outputs.release_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require manual Mac validation and an unpublished main-ancestor tag
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          MACOS_TESTED_REVISION: ${{ inputs.macos_tested_revision }}
        run: python3 scripts/release.py prepare --tag "$RELEASE_TAG"

  checks:
    name: Hosted release checks
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ needs.prepare.outputs.revision }}
      version: ${{ inputs.tag }}

  publish:
    name: Publish the verified draft
    needs: [prepare, checks]
    if: >-
      needs.prepare.result == 'success' &&
      needs.checks.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-package-*
          path: packages
          merge-multiple: true
      - name: Recheck tag and draft identity before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
          RELEASE_TAG_OID: ${{ needs.prepare.outputs.tag_oid }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          MACOS_TESTED_REVISION: ${{ inputs.macos_tested_revision }}
        run: python3 scripts/release.py publish --tag "$RELEASE_TAG" --assets packages
