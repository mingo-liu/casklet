name: macOS end-to-end

# Persistent Mac runners must never execute pull-request code automatically.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      version:
        required: false
        type: string
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: macos-end-to-end
  cancel-in-progress: false

jobs:
  trusted-source:
    name: Validate trusted source
    if: >-
      (vars.CASKLET_MACOS_E2E_ENABLED == '1' || inputs.revision != '') &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require a revision already merged into main
        id: source
        env:
          REVISION: ${{ github.sha }}
          SELECTED_REVISION: ${{ inputs.revision }}
          CASKLET_MACOS_E2E_ENABLED: ${{ vars.CASKLET_MACOS_E2E_ENABLED }}
        run: |
          set -eu
          test "$CASKLET_MACOS_E2E_ENABLED" = 1 || { echo 'Configure both dedicated Mac architectures and enable CASKLET_MACOS_E2E_ENABLED'; exit 1; }
          if [ -n "$SELECTED_REVISION" ]; then REVISION=$SELECTED_REVISION; fi
          printf '%s\n' "$REVISION" | grep -Eq '^[0-9a-f]{40}$'
          git cat-file -e "$REVISION^{commit}"
          git merge-base --is-ancestor "$REVISION" origin/main
          printf 'revision=%s\n' "$REVISION" >> "$GITHUB_OUTPUT"

  macos-e2e:
    name: Real client and Lima VM (${{ matrix.arch }})
    needs: trusted-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ARM64
            goarch: arm64
          - arch: X64
            goarch: amd64
    runs-on: [self-hosted, macOS, casklet-e2e, '${{ matrix.arch }}']
    environment: macos-e2e
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.trusted-source.outputs.revision }}
          path: source
          persist-credentials: false
      - name: Check out trusted runner controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: gate
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: source/go.mod
      - name: Run disposable macOS end-to-end suite
        env:
          CASKLET_MACOS_CI_ARTIFACTS: ${{ runner.temp }}/casklet-macos-e2e-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.goarch }}
          CASKLET_MACOS_EXPECT_ARCH: ${{ matrix.goarch }}
          CASKLET_MACOS_REQUIRE_NO_SKIPS: '1'
          CASKLET_RELEASE_VERSION: ${{ inputs.version }}
        run: python3 gate/scripts/test-macos-ci.py --project "$GITHUB_WORKSPACE/source"
      - name: Upload test and VM diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-e2e-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/casklet-macos-e2e-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.goarch }}
          if-no-files-found: warn
          retention-days: 14
