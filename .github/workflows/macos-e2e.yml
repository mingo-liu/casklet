name: macOS end-to-end

# Persistent Mac runners must never execute pull-request code automatically.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: macos-end-to-end
  cancel-in-progress: false

jobs:
  trusted-source:
    name: Validate trusted source
    if: >-
      vars.CASKLET_MACOS_E2E_ENABLED == '1' &&
      (github.event_name == 'schedule' || github.event_name == 'release' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require a revision already merged into main
        id: source
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -eu
          git cat-file -e "$REVISION^{commit}"
          git merge-base --is-ancestor "$REVISION" origin/main
          printf 'revision=%s\n' "$REVISION" >> "$GITHUB_OUTPUT"

  macos-e2e:
    name: Real client and Lima VM
    needs: trusted-source
    runs-on: [self-hosted, macOS, casklet-e2e]
    environment: macos-e2e
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.trusted-source.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Run disposable macOS end-to-end suite
        env:
          CASKLET_MACOS_CI_ARTIFACTS: ${{ runner.temp }}/casklet-macos-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: ./scripts/test-macos-ci.py
      - name: Upload test and VM diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/casklet-macos-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
